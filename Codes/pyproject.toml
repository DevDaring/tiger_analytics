[project]
name = "podium"
version = "1.0.0"
description = "Podium - evidence-driven Agentic GraphRAG on TigerGraph (RAG vs GraphRAG vs Agentic GraphRAG benchmark)"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.7", "openai>=3.16", "pyTigerGraph>=2.0", "pydantic>=2.13", "httpx>=0.28", "python-dotenv>=1.2",
  "fastapi>=0.141", "uvicorn[standard]>=0.53", "numpy>=2", "pytest>=9", "pyyaml>=6", "orjson>=3", "tiktoken>=0.14", "jinja2>=3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["podium*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
